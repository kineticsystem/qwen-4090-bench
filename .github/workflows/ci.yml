# Checks what can be checked without an NVIDIA GPU, which GitHub's runners do not have:
#
# - lint: the shell scripts (ShellCheck), the Python scripts, the YAML files and the
#   compose file;
# - llama-swap: built from its submodule as scripts/build.sh builds it;
# - image: the container image, from docker/Dockerfile.
#
# The CUDA engines are not compiled here: their builds need 10 to 20 GB of memory and an
# hour on a runner, and each engine has its own CI.

name: CI

on: [push, pull_request]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y shellcheck
          shellcheck --severity=warning --external-sources \
            docker/dock.sh opencode-config.sh scripts/*.sh scripts/serve/*.sh
      - name: Python scripts
        run: python3 -m py_compile scripts/tools/*.py
      - name: YAML files
        run: python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" scripts/llama-swap.yaml docker/docker-compose.yml .github/workflows/*.yml
      - name: Compose file
        working-directory: docker
        run: docker compose config --quiet

  llama-swap:
    name: llama-swap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Check out llama-swap
        run: git submodule update --init --depth 1 engines/llama-swap
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: engines/llama-swap/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: |
          (cd engines/llama-swap/ui && npm ci --no-audit --no-fund && npm run build)
          (cd engines/llama-swap && go build -tags embed_ui -o ../../build/llama-swap/llama-swap .)
      - name: Load the configuration
        # llama-swap starts with scripts/llama-swap.yaml, whose models it only lists.
        run: |
          build/llama-swap/llama-swap -config scripts/llama-swap.yaml -listen 127.0.0.1:8085 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8085/v1/models && break; sleep 1; done
          curl -sf http://127.0.0.1:8085/v1/models | python3 -c "
          import json, sys
          ids = [m['id'] for m in json.load(sys.stdin)['data']]
          print(ids)
          assert len(ids) == 7, ids"

  image:
    name: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The CUDA development image is large: make room on the runner first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        working-directory: docker
        run: docker compose build
